<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protected Auth Gallery</title>
    <meta name="description" content="A small demo gallery that only renders protected content after valid login.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page-shell">
        <section id="login-container" class="panel" aria-labelledby="login-title">
            <p class="eyebrow">Protected demo</p>
            <h1 id="login-title">Login to view the gallery</h1>
            <p class="intro-copy">Enter the demo credentials to render the protected images.</p>
            <form id="login-form" novalidate>
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autocomplete="username" placeholder="Username">

                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Password">

                <button type="submit">Login</button>
                <p class="hint">Demo credentials: <strong>admin</strong> / <strong>12345</strong></p>
                <p id="error-msg" role="alert" aria-live="polite"></p>
            </form>
        </section>

        <section id="gallery-container" class="panel hidden" aria-labelledby="gallery-title">
            <p class="eyebrow">Authenticated state</p>
            <h2 id="gallery-title">Secret gallery</h2>
            <p class="intro-copy">Protected images are rendered only after a successful login.</p>
            <div id="gallery-grid" class="gallery-grid" aria-live="polite"></div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
